<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — SME Phishing Simulation & Awareness Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body data-page="login" class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-center items-center p-4">

  <!-- Security Isolation Notice Banner (Shown if Admin clicked Employee Email Link) -->
  <div id="isolation-banner" class="hidden max-w-md w-full mb-4 bg-amber-500/10 border border-amber-500/40 text-amber-300 px-4 py-3 rounded-xl text-sm"></div>

  <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl p-8">
    <div class="flex items-center justify-between mb-6">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center font-bold text-lg shadow-lg shadow-blue-600/30">🛡️</div>
        <div>
          <h1 class="text-xl font-bold text-white">Security Awareness Hub</h1>
          <p class="text-xs text-slate-400">Employee Training & Simulation Portal</p>
        </div>
      </div>
      <span class="text-[11px] bg-blue-500/10 text-blue-400 border border-blue-500/30 px-2.5 py-1 rounded-full font-medium">Employee Portal</span>
    </div>

    <div id="auth-alert" class="hidden mb-4 p-3 rounded-lg text-sm font-medium"></div>

    <!-- Employee Sign-In Form -->
    <form id="login-form" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Corporate Email</label>
        <input type="email" id="login-email" required placeholder="employee@company.com"
          class="w-full px-4 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-sm text-white focus:outline-none focus:border-blue-500" />
      </div>
      <div>
        <div class="flex justify-between items-center mb-1">
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400">Password</label>
          <button type="button" id="toggle-forgot-btn" class="text-xs text-blue-400 hover:text-blue-300">Forgot Password?</button>
        </div>
        <input type="password" id="login-password" required placeholder="•••••••• (Default: Employee123!)"
          class="w-full px-4 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-sm text-white focus:outline-none focus:border-blue-500" />
      </div>
      <button type="submit"
        class="w-full py-2.5 bg-blue-600 hover:bg-blue-500 text-white font-semibold rounded-xl shadow-lg shadow-blue-600/25 transition text-sm">
        Sign In to Training Portal
      </button>
    </form>

    <!-- Forgot Password Drawer -->
    <form id="forgot-form" class="hidden mt-4 pt-4 border-t border-slate-800 space-y-3">
      <p class="text-xs text-slate-400">Enter your registered email to receive a password recovery link.</p>
      <input type="email" id="forgot-email" required placeholder="you@company.com"
        class="w-full px-4 py-2 bg-slate-950 border border-slate-800 rounded-xl text-sm text-white" />
      <div class="flex space-x-2">
        <button type="submit" class="flex-1 py-2 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold rounded-lg">Send Reset Link</button>
        <button type="button" id="cancel-forgot-btn" class="px-3 py-2 bg-slate-800 text-slate-300 text-xs rounded-lg">Cancel</button>
      </div>
    </form>

    <!-- OAuth Divider -->
    <div class="my-6 flex items-center">
      <div class="flex-grow border-t border-slate-800"></div>
      <span class="px-3 text-xs text-slate-500 uppercase">Or Single Sign-On</span>
      <div class="flex-grow border-t border-slate-800"></div>
    </div>

    <div class="grid grid-cols-2 gap-3">
      <a href="/api/auth/google"
        class="flex items-center justify-center space-x-2 py-2.5 px-4 bg-slate-950 hover:bg-slate-800 border border-slate-800 rounded-xl text-xs font-medium text-slate-200 transition">
        <span>🌐</span><span>Google SSO</span>
      </a>
      <a href="/api/auth/github"
        class="flex items-center justify-center space-x-2 py-2.5 px-4 bg-slate-950 hover:bg-slate-800 border border-slate-800 rounded-xl text-xs font-medium text-slate-200 transition">
        <span>🐙</span><span>GitHub SSO</span>
      </a>
    </div>

    <!-- Dedicated Link to Admin SOC Login -->
    <div class="mt-6 pt-5 border-t border-slate-800/80 flex items-center justify-between text-xs text-slate-400">
      <span>SOC Administrator?</span>
      <a href="/admin-login" class="text-emerald-400 hover:text-emerald-300 font-semibold flex items-center space-x-1">
        <span>🔐 Go to Admin SOC Login</span>
        <span>→</span>
      </a>
    </div>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
