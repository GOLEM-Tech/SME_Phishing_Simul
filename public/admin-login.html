<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin SOC Login — SME Phishing Simulator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body data-page="admin-login" class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-center items-center p-4">

  <div class="max-w-md w-full bg-slate-900 border border-emerald-500/30 rounded-2xl shadow-2xl p-8">
    <div class="flex items-center justify-between mb-6">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-emerald-600 flex items-center justify-center font-bold text-lg shadow-lg shadow-emerald-600/30">🔐</div>
        <div>
          <h1 class="text-xl font-bold text-white">SOC Command Center</h1>
          <p class="text-xs text-slate-400">Restricted Administrator Authentication</p>
        </div>
      </div>
      <span class="text-[11px] bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 px-2.5 py-1 rounded-full font-semibold">Admin Only</span>
    </div>

    <div id="auth-alert" class="hidden mb-4 p-3 rounded-lg text-sm font-medium"></div>

    <form id="admin-login-form" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Administrator Email</label>
        <input type="email" id="admin-email" required placeholder="omjalela4@gmail.com"
          class="w-full px-4 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-sm text-white focus:outline-none focus:border-emerald-500" />
      </div>
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Master Password</label>
        <input type="password" id="admin-password" required placeholder="••••••••"
          class="w-full px-4 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-sm text-white focus:outline-none focus:border-emerald-500" />
      </div>
      <button type="submit"
        class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold rounded-xl shadow-lg shadow-emerald-600/25 transition text-sm">
        Authenticate to SOC Console
      </button>
    </form>

    <div class="my-6 flex items-center">
      <div class="flex-grow border-t border-slate-800"></div>
      <span class="px-3 text-xs text-slate-500 uppercase">Admin OAuth SSO</span>
      <div class="flex-grow border-t border-slate-800"></div>
    </div>

    <div class="grid grid-cols-2 gap-3">
      <a href="/api/auth/google"
        class="flex items-center justify-center space-x-2 py-2.5 px-4 bg-slate-950 hover:bg-slate-800 border border-slate-800 rounded-xl text-xs font-medium text-slate-200 transition">
        <span>🌐</span><span>Google Admin</span>
      </a>
      <a href="/api/auth/github"
        class="flex items-center justify-center space-x-2 py-2.5 px-4 bg-slate-950 hover:bg-slate-800 border border-slate-800 rounded-xl text-xs font-medium text-slate-200 transition">
        <span>🐙</span><span>GitHub Admin</span>
      </a>
    </div>

    <div class="mt-6 pt-5 border-t border-slate-800 flex items-center justify-between text-xs text-slate-400">
      <span>Looking for Employee Training?</span>
      <a href="/login" class="text-blue-400 hover:text-blue-300 font-semibold">← Employee Login</a>
    </div>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
