<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Employee Onboarding — SME Phishing Simulator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body data-page="onboarding" class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-2xl">
    <div class="flex items-center justify-between mb-4">
      <h1 class="text-xl font-bold text-white">👋 Complete Employee Onboarding</h1>
      <span id="onboarding-session-badge" class="text-[11px] font-mono bg-slate-800 text-slate-300 px-2 py-1 rounded"></span>
    </div>
    <p class="text-sm text-slate-400 mb-6">
      Welcome <span id="onboarding-name" class="text-white font-semibold">Employee</span>! Select your corporate department so an Administrator can approve your training profile.
    </p>

    <div id="onboarding-alert" class="hidden mb-4 p-3 rounded-lg text-sm"></div>

    <form id="onboarding-form" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Select Corporate Department</label>
        <select id="onboarding-dept" required
          class="w-full px-4 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-sm text-white">
          <option value="IT">IT & Infrastructure</option>
          <option value="Finance">Finance & Accounting</option>
          <option value="HR">Human Resources (HR)</option>
          <option value="Marketing">Marketing & Growth</option>
          <option value="Engineering">Software Engineering</option>
          <option value="Sales">Sales & Operations</option>
        </select>
      </div>
      <button type="submit"
        class="w-full py-2.5 bg-blue-600 hover:bg-blue-500 text-white font-semibold rounded-xl text-sm transition">
        Submit Department for Approval
      </button>
    </form>

    <div class="mt-6 pt-4 border-t border-slate-800 flex justify-between items-center text-xs">
      <button id="onboarding-check-btn" class="text-blue-400 hover:underline">🔄 Check Approval Status</button>
      <button id="logout-btn" class="text-rose-400 hover:underline">Sign Out</button>
    </div>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
