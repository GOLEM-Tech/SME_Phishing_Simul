<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — SME Phishing Simulator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body data-page="reset-password" class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-2xl">
    <h1 class="text-xl font-bold text-white mb-2">🔑 Set New Password</h1>
    <p class="text-xs text-slate-400 mb-6">Enter your new corporate password below.</p>

    <div id="reset-alert" class="hidden mb-4 p-3 rounded-lg text-sm"></div>

    <form id="reset-password-form" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">New Password</label>
        <input type="password" id="new-password" required minlength="6" placeholder="Enter new strong password"
          class="w-full px-4 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-sm text-white" />
      </div>
      <button type="submit"
        class="w-full py-2.5 bg-blue-600 hover:bg-blue-500 text-white font-semibold rounded-xl text-sm">
        Update Password
      </button>
    </form>

    <div class="mt-6 text-center">
      <a href="/login" class="text-xs text-blue-400 hover:underline">← Back to Login</a>
    </div>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
